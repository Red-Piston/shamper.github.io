    <div class="app">

    <div class="tabs">
        <div class="tab" data-tab="about">Обо мне</div>
        <div class="tab" data-tab="portfolio">Портфолио</div>

    <div class="window" id="window"></div>
        </div>

    <!-- аудиоплеер -->
    <div class="player">
        <audio id="audio"></audio>
        <div style="display: flex; flex-direction: row;">
            <img id="trackCover" src="assets/player/covers/unknown-track.png" alt="Cover">

            <div style="display: flex; flex-direction: column; width: 100%; margin-left: 10px;">
                <span class="player-textTitle" id="trackTitle">Название</span><br>
                <span class="player-author fade-in" id="trackAuthor">Автор</span><br>

                <input class="track-time-slider" type="range" id="seekSlider" min="0" max="100" value="0" step="1">

                <div id="player-div">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>

            </div>
        </div>

        <div style="width: 100%; display: flex; flex-direction: row; align-items: center; justify-content: center; margin: 0;">
            <button id="prevTrack" class="player-button"><img src="assets/player/skip_previous.svg"></button>
            <button id="playPause" class="player-button playPause"><img id="playPauseIcon" src="assets/player/play_arrow.svg"></button>
            <button id="nextTrack" class="player-button"><img src="assets/player/skip_next.svg"></button>
        </div>

        <div style="width: 100%; display: flex; align-items: center; justify-content: center;">
            <input class="player-input" type="range" id="volume" min="0" max="1" value="0.50" step="0.01" style="width: 40%;"><br>
        </div>

    </div>



    <div id="modal" class="modal">
        <div class="modal-content"></div>
    </div>

    <div id="toast" class="toast">
        <span id="toastText">Скопировано</span>
    </div>

    <!-- Кнопка настроек -->
    <button id="settings-btn" class="settings-floating-btn" aria-label="Настройки" title="Настройки">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <p class="made-with-love" data-text="made with love by shamper">made with love by shamper</p>

    </body>

    <script>
        document.getElementById('settings-btn')?.addEventListener('click', () => {
            if (typeof openSettingsModal === 'function') {
                openSettingsModal();
            }
        });
    </script>
    <script>
        window.addEventListener('load', () => {
            const settings = window.getSiteSettings ? window.getSiteSettings() : { player: true };
            if (settings.player) {
                document.querySelector('.player')?.classList.add('show');
            }
        });
    </script>
    <script>
        function isMobile() {
        if (window.innerWidth < 769) {
            return true;
        }
        return false;
        }
    </script>
    <script>
        const title = document.querySelector(".made-with-love");

        title.addEventListener("mousemove", (e) => {
            const rect = title.getBoundingClientRect();

            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            title.style.setProperty("--x", `${x}%`);
            title.style.setProperty("--y", `${y}%`);
        });
    </script>
    <script>
        document.addEventListener("mousemove", (e) => {
            const link = e.target.closest(".log-repo-link");

            if (!link) return;

            const rect = link.getBoundingClientRect();

            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;

            link.style.setProperty("--x", `${x}%`);
            link.style.setProperty("--y", `${y}%`);
        });
    </script>
    <script>
        document.addEventListener("click", (e) => {
            const card = e.target.closest(".social-bttn");

            if (!card) return;

            const link = card.dataset.link;
            if (link) {
                window.location.href = link;
            }
        });
    </script>
</html>
